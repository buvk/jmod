; One value for each item code in the supplied 1.09b tables.
; Affects ground labels only.
; 0x01 normal (including inferior/superior), 0x02 magic, 0x04 rare,
; 0x08 set, 0x10 unique, 0x20 crafted. Add the bits to combine.
; 0x00 hide, 0x3F show all. Quest items remain visible.
; Potions, arrows, bolts, runes and gems use the normal bit.
; Gold uses MinGold in jmod.ini, regardless of its entry below.

