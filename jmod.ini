[Mods]
QuickCast=1
AlwaysShowItems=1
AutoGoldPickup=1
GoldPickupInTown=0
RuneColor=1
GoldPickupRange=4
GoldScanIntervalMs=30
GoldRequestIntervalMs=50
GoldRetryIntervalMs=500

[LootFilter]
; 0 = off, 1 = on. Affects ground labels only; items remain on the ground.
Enabled=1
; Hide gold piles smaller than this amount. 0 = show all piles.
MinGold=500
; Potion values: Any, Minor, Light, Standard, Greater, Super, None.
; Show the selected tier and higher. Any shows all; None hides all.
MinHealthPotion=Greater
MinManaPotion=Greater
; Rejuvenation values: Any, Full, None.
; Full hides regular rejuvenation potions; None hides both sizes.
MinRejuvenationPotion=Full
