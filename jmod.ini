[Mods]
; 0 = off, 1 = on. Hold a bound skill key to cast with the right mouse button.
QuickCast=1
; 0 = normal Show Items key, 1 = press that key to toggle ground labels.
AlwaysShowItems=1
; 0 = off, 1 = on. Automatically pick up nearby gold while the game is focused.
AutoGoldPickup=1
; 0 = skip towns, 1 = also pick up gold in towns. Requires AutoGoldPickup=1.
GoldPickupInTown=0
; 0 = original rune name color, 1 = show recognized rune names in orange.
RuneColor=1
; 0 = off, 1 = show the possible roll range beside supported item stats.
ItemStatRanges=1
; Auto-pickup range using the game's own distance calculation, clamped to 1-4.
; 4 is D2Game 1.09b's maximum immediate item-pickup distance.
GoldPickupRange=4
; 0 = off, 1 = enables Ctrl+left-click quick move, sell, and drop actions.
CtrlClickActions=1

[LootFilter]
; 0 = off, 1 = on. Hides selected ground labels and hover highlights, not items.
Enabled=1
; 0 = suspend filtering in town, 1 = keep filtering in town.
FilterInTown=0
; Hide gold piles below this amount. 0 = show all piles; pickup is unaffected.
MinGold=500
; Set individual item names and quality masks in loot_filter.ini.
